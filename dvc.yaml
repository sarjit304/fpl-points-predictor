stages:
  combine-data:
    cmd: uv run python src/combine_data.py
    deps:
      - src/combine_data.py
      - DSCI_611_project/all_gameweeks.csv
      - DSCI_611_project/historical/
    outs:
      - data/raw/combined_all_seasons.csv

  clean:
    cmd: uv run python src/Data_cleaning.py
    deps:
      - src/Data_cleaning.py
      - data/raw/combined_all_seasons.csv
    outs:
      - data/processed/cleaned_all_seasons.csv

  feature-engineering:
    cmd: uv run python src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - data/processed/cleaned_all_seasons.csv
    outs:
      - data/processed/features_all_seasons.csv

  train-test-split:
    cmd: uv run python src/train_test_split.py
    deps:
      - src/train_test_split.py
      - data/processed/features_all_seasons.csv
    outs:
      - data/test.csv
      - data/train.csv

  train:
    cmd: uv run python src/train.py
    deps:
      - src/train.py
      - params.json
      - data/train.csv
      - data/test.csv
    outs:
      - models/ridge_model.joblib
      - models/rf_model.joblib
      - models/gb_model.joblib
      - data/predictions.csv

  tune:
    cmd: uv run python src/tune.py
    deps:
      - src/tune.py
      - params.json
      - data/train.csv
    outs:
      - models/tuned_params.json

  train-tuned:
    cmd: uv run python src/train.py --mode tuned --tuned-params-path models/tuned_params.json
    deps:
      - src/train.py
      - params.json
      - data/train.csv
      - data/test.csv
      - models/tuned_params.json
    outs:
      - models/ridge_model_tuned.joblib
      - models/rf_model_tuned.joblib
      - models/gb_model_tuned.joblib
      - data/predictions_tuned.csv

  evaluate:
    cmd: uv run python src/evaluate.py
    deps:
      - src/evaluate.py
      - data/test.csv
      - data/predictions.csv
      - data/predictions_tuned.csv
    metrics:
      - metrics/results.json:
          cache: false
