stages:
  combine-data:
    cmd: uv run python src/combine_data.py
    deps:
      - src/combine_data.py
      - DSCI_611_project/all_gameweeks.csv
      - DSCI_611_project/historical/
    outs:
      - data/raw/combined_all_seasons.csv

  clean:
    cmd: uv run python src/Data_cleaning.py
    deps:
      - src/Data_cleaning.py
      - data/raw/combined_all_seasons.csv
    outs:
      - data/processed/cleaned_all_seasons.csv

  feature-engineering:
    cmd: uv run python src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - data/processed/cleaned_all_seasons.csv
    outs:
      - data/processed/features_all_seasons.csv

  train-test-split:
    cmd: uv run python src/train_test_split.py
    deps:
      - src/train_test_split.py
      - data/processed/features_all_seasons.csv
    outs:
      - data/test.csv
      - data/train.csv

  tune:
    cmd: uv run python src/tune.py
    deps:
      - src/tune.py
      - data/train.csv
    params:
      - features
      - sample_weight
      - cross_validation
      - baseline.ridge.alpha
      - tuning
    outs:
      - models/tuned_params.json

  train:
    cmd: uv run python src/train.py --mode both
    deps:
      - src/train.py
      - data/train.csv
      - data/test.csv
      - models/tuned_params.json
    params:
      - features
      - baseline
      - paths.train_data
      - paths.test_data
    outs:
      - models/baseline/
      - models/tuned/
      - data/predictions_baseline.csv
      - data/predictions_tuned.csv

  evaluate:
    cmd: uv run python src/evaluate.py
    deps:
      - src/evaluate.py
      - data/test.csv
      - data/predictions_baseline.csv
      - data/predictions_tuned.csv
    params:
      - features.target
      - paths.test_data
      - paths.metrics_dir
    metrics:
      - metrics/results.json:
          cache: false
      - metrics/baseline_metrics.json:
          cache: false
      - metrics/tuned_metrics.json:
          cache: false
      - metrics/comparison_metrics.json:
          cache: false
